version: 1
name: Crates.io release
system: x86_64-linux
reuse: never
on:
  push:
    tags: ["v*"]
needs-workflows:
  ci: ci.yaml
jobs:
  publish:
    requirements:
      resources:
        memory-mib: {gte: 5120}
    cancellation: {grace: 10m}
    concurrency:
      group: crates-io
      cancel-in-progress: false
    secrets: [CARGO_REGISTRY_TOKEN]
