version: 1
name: Publish release binaries
system: x86_64-linux
reuse: never
on:
  push:
    tags: ["v*"]
needs-workflows:
  ci: ci.yaml
  archives: archives.yaml
jobs:
  publish:
    needs: [archives.collect]
    run: archives.publish
    secrets: [NGIT_PUBLISHER_NBUNKSEC]
    concurrency:
      group: binary-release
      cancel-in-progress: false
  mirror:
    needs: [archives.collect]
    run: archives.mirror
    secrets: [GH_RELEASE_TOKEN]
    concurrency:
      group: github-release-mirror
      cancel-in-progress: false
  update-setup:
    needs: [publish, mirror, archives.collect]
    run: archives.update-setup
    secrets: [NGIT_PUBLISHER_NBUNKSEC, GH_RELEASE_TOKEN]
    concurrency:
      group: setup-ngit-release
      cancel-in-progress: false
