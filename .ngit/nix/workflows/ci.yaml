version: 1
name: Rust CI
system: x86_64-linux
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
jobs:
  rust:
    steps:
      - dependencies: {build: packages.x86_64-linux.ci-dependencies}
      - test-server: {build: packages.x86_64-linux.ci-test-server}
      - format
      - compile
      - lint
      - tests
