version: 1
name: Release prep
system: x86_64-linux
reuse: commit
on:
  workflow_dispatch:
needs-workflows:
  ci: ci.yaml
  macos: macos-checks.yaml
  archives: archives.yaml
jobs:
  crate:
    run: release.package
  ready:
    needs: [crate, archives.collect]
    run: archives.prepare
    artifacts:
      release-set: release
