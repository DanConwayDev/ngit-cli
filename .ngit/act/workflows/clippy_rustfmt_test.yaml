on: [push, pull_request]

name: build test

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Incremental state grows quickly and is not useful once workspace
      # artifacts are removed from the reusable dependency cache below.
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - name: Restore Nix store cache
        continue-on-error: true
        uses: nix-community/cache-nix-action@v7
        with:
          # Reuse older shells only while the locked package universe is the
          # same, then bound the store before the post-job archive is created.
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock') }}-${{ hashFiles('**/*.nix') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-${{ hashFiles('flake.lock') }}-
          gc-max-store-size-linux: 12G
      - name: Restore Cargo source cache
        continue-on-error: true
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
          key: cargo-sources-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-sources-${{ runner.os }}-
      - name: Restore Rust dependency build cache
        continue-on-error: true
        uses: actions/cache@v4
        with:
          path: |
            target
          # Compiled artifacts are compatible only with this exact toolchain
          # and dependency graph. Source-only changes can reuse the cache.
          key: rust-target-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock', '**/Cargo.toml', 'Cargo.lock') }}
      - name: Build and root Nix development shell
        run: >-
          nix build --out-link "$RUNNER_TEMP/ngit-ci-dev-shell"
          .#devShells.x86_64-linux.default
      - run: nix develop --command cargo clippy
      - run: nix develop --command cargo fmt --all -- --check
      - run: nix develop --command cargo test
      - name: Test pinned Buzz compatibility
        run: nix develop --command cargo test --test private_buzz -- --ignored
      - name: Publish release tag to crates.io
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          version="$(nix eval --impure --raw --expr '(builtins.fromTOML (builtins.readFile ./Cargo.toml)).package.version')"
          if [[ "$GITHUB_REF" != "refs/tags/v$version" ]]; then
            echo "release tag must match Cargo.toml version v$version" >&2
            exit 1
          fi
          : "${CARGO_REGISTRY_TOKEN:?Configure the repository CARGO_REGISTRY_TOKEN secret in ngit-ci}"
          nix develop --command cargo publish --locked --registry crates-io --package ngit
      - name: Prune Rust build cache
        if: ${{ always() }}
        run: |
          if [ -d target ]; then
            nix develop --command cargo clean --package ngit --package test_harness
            rm -rf target/debug/incremental target/tmp
          fi
