name: Release

permissions:
  contents: read

on:
  push:
    tags:
      - v[0-9]+.*

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: taiki-e/create-gh-release-action@v1
        with:
          changelog: CHANGELOG.md
          # (required) GitHub token for creating GitHub Releases.
          token: ${{ secrets.GITHUB_TOKEN }}

  upload-assets:
    needs: create-release
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          # NOTE: compatibility according to LLM model o3
          # ---------- everything we can build on Linux ----------
          # x86_64
          # compatibility: Ubuntu 14.04+, Debian 8+, RHEL/CentOS 7+, Fedora 21+, openSUSE, Arch, etc. Any x86-64 distro with glibc ≥ 2.17. (Not Alpine)
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu.2.17
            build-tool: cargo-zigbuild
          # aarch64
          # compatibility: Ubuntu 20.04+, Debian 11+, Amazon Linux 2, AWS Graviton, Raspberry Pi OS 64-bit, etc. Any aarch64/arm64 distro with glibc ≥ 2.17.
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu.2.17
            build-tool: cargo-zigbuild
          # musl (Alpine etc.)
          # compatibility: Alpine 3.12+, Distroless and scratch containers, and very old glibc systems. Fully static; no external libraries. Still needs a CA-certificate bundle (apk add ca-certificates on Alpine).
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            build-tool: cargo-zigbuild
          # # windows - faster alternative to native windows toolchain
          # # compatibility: Windows 7 SP1 / Server 2008 R2 and newer, including Windows 11. Requires the “Universal C Runtime” which is already present on Windows 10+ or via the VC++ 2015-2022 redistributable on older systems. No other DLLs needed.
          # - os: ubuntu-latest
          #   target: x86_64-pc-windows-msvc
          #   build-tool: cargo-zigbuild
          # ---------- macOS (needs real mac runner) -------------
          # compatibility: macOS 10.13 High Sierra (2017) or newer. Intel + Apple Silicon.
          - os: macos-14
            target: universal-apple-darwin
            build-tool: cargo
          # ---------- native Windows toolchain ------------------
          # switch to this if issues are reported with the zig build
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            build-tool: cargo
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-zigbuild using Homebrew for macOS
        if: runner.os == 'macOS' && matrix.build-tool == 'cargo-zigbuild'
        run: brew install cargo-zigbuild
      - id: release-archive
        uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: ngit,git-remote-nostr
          target: ${{ matrix.target }}
          features: vendored-openssl
          build-tool: ${{ matrix.build-tool }}
          # final file name: ngit-v1.6.3-x86_64-unknown-linux-gnu.tar.gz  …
          archive: ngit-$tag-${{ matrix.target }}
          tar: unix
          zip: windows
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Retain Unix archive for NIP-82 publication
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: nip82-${{ matrix.target }}
          path: ${{ steps.release-archive.outputs.tar }}
          if-no-files-found: error
          retention-days: 1
      - name: Retain Windows archive for NIP-82 publication
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: nip82-${{ matrix.target }}
          path: ${{ steps.release-archive.outputs.zip }}
          if-no-files-found: error
          retention-days: 1

  publish-nip82:
    needs: upload-assets
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: nip82-*
          path: artifacts
          merge-multiple: true
      - uses: danconwaydev/setup-ngit@v3
      - name: Publish NIP-82 release
        shell: bash
        env:
          NGIT_PUBLISHER_NBUNKSEC: ${{ secrets.NGIT_PUBLISHER_NBUNKSEC }}
          NGIT_REPOSITORY: nostr://npub15qydau2hjma6ngxkl2cyar74wzyjshvl65za5k5rl69264ar2exs5cyejr/relay.ngit.dev/ngit
        run: |
          set -euo pipefail

          if [[ -z "${NGIT_PUBLISHER_NBUNKSEC:-}" ]]; then
            printf 'NGIT_PUBLISHER_NBUNKSEC is required\n' >&2
            exit 1
          fi

          signer_file="$RUNNER_TEMP/ngit-release.nbunksec"
          cleanup() {
            rm -f "$signer_file"
          }
          trap cleanup EXIT
          umask 077
          printf '%s\n' "$NGIT_PUBLISHER_NBUNKSEC" > "$signer_file"

          version="${GITHUB_REF_NAME#v}"
          if [[ "$version" == *-* ]]; then
            channel=beta
          else
            channel=main
          fi
          released_at="$(
            git for-each-ref --format='%(creatordate:unix)' \
              "refs/tags/$GITHUB_REF_NAME"
          )"
          if [[ -z "$released_at" ]]; then
            printf 'Could not determine the creation time of tag %s\n' \
              "$GITHUB_REF_NAME" >&2
            exit 1
          fi

          ngit \
            --repo "$NGIT_REPOSITORY" \
            --nbunksec-file "$signer_file" \
            --defaults \
            --json \
            release publish "$version" \
            --manifest .ngit/release.yaml \
            --channel "$channel" \
            --tag "$GITHUB_REF_NAME" \
            --commit "$GITHUB_SHA" \
            --released-at "$released_at"
