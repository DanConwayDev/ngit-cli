[package]
name = "ngit"
version = "3.0.0-rc.7"
edition = "2021"
description = "nostr plugin for git"
authors = ["DanConwayDev <DanConwayDev@protonmail.com>"]
readme = "README.md"
homepage = "https://ngit.dev"
repository = "https://ngit.dev/ngit.git"
license = "MIT"
keywords = ["nostr", "git"]
categories = ["command-line-utilities","development-tools"]

[dependencies]
anyhow = "1.0.104"
apk-info = "1.0.12"
async-trait = "0.1.92"
auth-git2 = "0.6.0"
# `nostr` stopped re-exporting `bitcoin_hashes` at 0.45.0-alpha.8, but its
# NIP-34 API still takes `bitcoin_hashes::sha1::Hash`. Keep this in step with
# the version `nostr` depends on so the two `Sha1Hash` types stay identical.
# `nostr` 0.45.0 moved from `bitcoin_hashes` 0.14 to 1.x.
bitcoin_hashes = "1.2"
base64 = "0.23.1"
bech32 = "0.12.0"
chacha20poly1305 = "0.11.0"
chrono = "0.4"
clap = { version = "4.6.6", features = ["derive", "env"] }
console = "0.16.4"
crossterm = "0.29.0"
dialoguer = "0.12.0"
directories = "6.0.0"
flate2 = "1.1"
futures = "0.3.34"
git2 = { version = "0.21.0", features = ["ssh", "https"] }
indicatif = "0.18.6"
# `keyring` 4's default `v1` feature provides persistent native stores on
# macOS, Windows, and Unix (Secret Service). Keep defaults enabled: disabling
# them makes `keyring` reject the build instead of selecting a real store.
keyring = "4.1.6"
mailparse = "0.16.1"
mime_guess = "2.0"
# NostrDevKit 0.45.0 is a stable release, so an ordinary caret requirement
# is safe again: it no longer admits breaking pre-releases the way a caret
# on `0.45.0-alpha.N` did. Bump these together.
nostr = { version = "0.45.4", features = ["nip44", "nip49"] }
nostr-connect = "0.45.1"
nostr-database = "0.45.1"
nostr-lmdb = "0.45.2"
nostr-memory = "0.45.1"
nostr-sdk = "0.45.2"
passwords = "3.1.18"
qrcode = { version = "0.14.1", default-features = false }
# Keep Reqwest provider-neutral so rustls compiles with Ring alone, while
# retaining Reqwest's other default features. `rustls-no-provider` requires
# the application to install a process-wide provider before building a client;
# ngit does that explicitly through `tls::install_default_crypto_provider`.
reqwest = { version = "0.13.4", default-features = false, features = ["charset", "http2", "json", "rustls-no-provider", "stream", "system-proxy"] }
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std"] }
scrypt = "0.12.0"
semver = "1.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml = "0.9.34"
tar = "0.4"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = { version = "0.7.19", features = ["io"] }
urlencoding = "2.1.3"
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
zeroize = "1.9.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
assert_cmd = "2.2.2"
mockall = "0.15.0"
once_cell = "1.21.4"
rstest = "0.26"
serial_test = "4.0.1"
test_harness = { path = "test_harness" }
# `test-util` is not part of tokio's `full` feature. It provides the paused
# test clock the CI identity-resolution deadline is asserted on, which is how
# that test measures a five-second budget without any wall-clock time passing.
# Resolver 2 keeps a dev-dependency feature out of normal builds.
tokio = { version = "1.53.1", features = ["test-util"] }

[workspace]
members = [
    "test_harness",
]

[lib]
name = "ngit"
path = "src/lib/mod.rs"

[features]
default = []
native-tls-roots = [
    "nostr-connect/rustls-tls-native-roots",
    "nostr-sdk/rustls-tls-native-roots",
]
vendored-openssl = ["git2/vendored-openssl"]

[[bin]]
name = "ngit"
path = "src/bin/ngit/main.rs"

# Compatibility launcher: git discovers remote helpers by executable
# name, but the implementation lives in the `ngit` binary (invoked via
# a hidden internal command). Both names must keep installing so
# `cargo install ngit` provides a working remote helper.
[[bin]]
name = "git-remote-nostr"
path = "src/bin/git_remote_nostr.rs"

# `git push` against a nostr:// remote — one submodule per scenario under
# `tests/git_push_state/`. The directory layout means Cargo doesn't
# auto-discover this test, so it needs an explicit entry.
[[test]]
name = "git_push_state"
path = "tests/git_push_state/main.rs"

# `git push pr/<branch>` producing PR events — one submodule per scenario under
# `tests/git_push_pr/`. The directory layout means Cargo doesn't auto-discover
# this test, so it needs an explicit entry.
[[test]]
name = "git_push_pr"
path = "tests/git_push_pr/main.rs"

# NIP-82 software application/release/asset command workflows.
[[test]]
name = "release"
path = "tests/release/main.rs"

[profile.release]
lto = true
strip = "symbols"
