[package]
name = "test_harness"
version = "0.1.0"
edition = "2021"
publish = false
description = "Integration test harness for ngit."

[dependencies]
anyhow = "1.0.98"
git2 = "0.21.0"
http-body-util = "0.1"
hyper = { version = "1.4", features = ["full"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "http1"] }
# Kept in step with the root crate — see the note in ../Cargo.toml.
nostr = "0.45.0"
# `nostr-relay-builder` was merged into `nostr-sdk` behind the `local-relay`
# feature; `LocalRelay` now lives at `nostr_sdk::local_relay`.
nostr-sdk = { version = "0.45.0", features = ["local-relay"] }
tempfile = "3.10"
tokio = { version = "1.52.3", features = ["full"] }
