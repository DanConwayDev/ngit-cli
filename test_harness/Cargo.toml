[package]
name = "test_harness"
version = "0.1.0"
edition = "2021"
publish = false
description = "Integration test harness for ngit."

[dependencies]
anyhow = "1.0.104"
# Kept in step with the root crate: the CI fixture builder hashes workflow
# file content for the `w` tag with the same SHA-256 implementation ngit
# verifies it against.
bitcoin_hashes = "1.2"
git2 = "0.21.0"
http-body-util = "0.1"
hyper = { version = "1.11", features = ["full"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "http1"] }
# Kept in step with the root crate — see the note in ../Cargo.toml.
nostr = "0.45.3"
# `nostr-relay-builder` was merged into `nostr-sdk` behind the `local-relay`
# feature; `LocalRelay` now lives at `nostr_sdk::local_relay`.
nostr-sdk = { version = "0.45.2", features = ["local-relay"] }
serde_json = "1.0.151"
tempfile = "3.27"
tokio = { version = "1.53.1", features = ["full"] }

[dev-dependencies]
# Drives the Blossom fixture's own tests through the same HTTP client ngit
# uses, so the fixture's socket-level behaviour is asserted as reqwest sees it.
# Match ngit's TLS feature even when these tests run without the root package.
# Workspace feature unification otherwise enables it only in workspace runs.
reqwest = { version = "0.13.4", default-features = false, features = ["charset", "http2", "json", "rustls-no-provider"] }
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std"] }
